name: One-time catalog migration and exhibition regeneration
on:
  push:
    branches:
      - feat/ca660-four-artworks-deduplicate-aura-20261021
    paths:
      - .github/workflows/rebuild-aura-ca660-once.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image tooling
        run: python3 -m pip install 'Pillow==12.3.0'
      - name: Preserve verified II source pixels under corrected title
        run: |
          cp assets/obras/aura-cosmica-i-reframed-original-web.webp assets/obras/aura-cosmica-ii-reframed-original-web.webp
          cmp assets/obras/aura-cosmica-i-reframed-original-web.webp assets/obras/aura-cosmica-ii-reframed-original-web.webp
      - name: Regenerate all source-linked previews and catalog HTML
        run: |
          python3 scripts/generate_gallery_variants.py
          python3 scripts/build.py
      - name: Drop stale duplicate thumbnails (retain source archival records)
        run: |
          git rm -f assets/obras/gallery/aura-cosmica-i-480.webp assets/obras/gallery/aura-cosmica-i-960.webp
      - name: Verify source, output pages, links and exhibition membership
        run: |
          python3 scripts/generate_gallery_variants.py --check
          python3 scripts/build.py --check
          python3 -m unittest discover -s tests -v
      - name: Commit independently verifiable static assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/obras/aura-cosmica-ii-reframed-original-web.webp assets/obras/gallery/ index.html obras/ sitemap.xml
          git commit -m "assets: deduplicate Aura II and publish verified four-work CA660 selection"
          git push origin "HEAD:feat/ca660-four-artworks-deduplicate-aura-20261021"
