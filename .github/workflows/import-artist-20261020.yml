name: Import artist camera originals (one-shot)

on:
  push:
    branches: [content/add-three-confirmed-works-2026]
    paths:
      - .github/workflows/import-artist-20261020.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AURA_I_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-dc98-820e-b76d-9e4d5bf1fdec/raw?se=2026-10-20T23%3A17%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=7274b355-45e7-5d22-80fa-5c3f96e9a071&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T21%3A24%3A08Z&ske=2026-10-21T21%3A24%3A08Z&sks=b&skv=2026-02-06&sig=AquQ8fL19/1lvRJG3SBfZ%2BFhrvFvr4%2BGBHgRzYyOZag%3D'
      HUELLICHES_II_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7a4c-820e-ad4f-3b4b19421c51/raw?se=2026-10-20T23%3A17%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=3457d55c-da20-5326-8493-cf6b2b821c36&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T09%3A36%3A59Z&ske=2026-10-21T09%3A36%3A59Z&sks=b&skv=2026-02-06&sig=gAq/5Qob4O2VsUngItHYaUH30Wz0zDETRAm%2BIGaU1lE%3D'
      PLUMAJE_AZUL_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-60bc-820e-a3e0-6cc4edad3b14/raw?se=2026-10-20T23%3A17%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=292c85f0-79d5-52fe-ab69-a79560f49e29&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T21%3A24%3A08Z&ske=2026-10-21T21%3A24%3A08Z&sks=b&skv=2026-02-06&sig=UBqQ8MJsZn1ZSRUt6XGvxndCwGMZk2JZcwACud4VlNo%3D'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Create faithful high-resolution web reproductions
        run: python scripts/import_three_artist_originals.py
      - name: Commit only optimized images
        run: |
          git add assets/obras/aura-cosmica-i-original-web.webp assets/obras/huelliches-ii-original-web.webp assets/obras/plumaje-azul-original-web.webp
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "assets: import three high resolution original artist reproductions"
          git push origin HEAD:${GITHUB_REF_NAME}
