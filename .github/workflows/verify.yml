name: Verify static portfolio
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image verification dependency
        run: python3 -m pip install 'Pillow==12.3.0' 'numpy==2.2.6'
      - name: Verify source-preserving glare edits
        run: python3 scripts/retouch_artworks.py --check
      - name: Verify 24 reproducible gallery derivatives
        run: python3 scripts/generate_gallery_variants.py --check
      - name: Verify generated HTML
        run: python3 scripts/build.py --check
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
