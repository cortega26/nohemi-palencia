name: Post-deployment visual audit capture
on:
  push:
    branches:
      - audit/visual-final-20261021
    paths:
      - .github/workflows/visual-audit-temp.yml
      - scripts/visual_audit_live.py
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium renderer
        run: |
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Audit live site and generate evidence
        run: python3 scripts/visual_audit_live.py
      - name: Make desktop full-page overview viewable for human QA
        if: always()
        run: |
          python3 -m pip install 'Pillow==12.3.0'
          python3 -c "from PIL import Image; p='visual-audit/evidence-post/desktop_full.jpg'; im=Image.open(p); im.thumbnail((720,16000)); im.save('visual-audit/evidence-post/desktop_full_overview.jpg',quality=76); print(im.size)"
      - name: Commit temporary QA evidence to audit branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f visual-audit/evidence-post/
          if ! git diff --cached --quiet; then
            git commit -m "audit: temporary Chromium evidence for human visual review"
            git push origin HEAD:audit/visual-final-20261021
          fi
