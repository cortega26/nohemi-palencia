name: Post-deployment visual audit capture
on:
  push:
    branches:
      - audit/visual-final-20261021
    paths:
      - .github/workflows/visual-audit-temp.yml
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium renderer
        run: |
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Audit live site and generate evidence
        run: python3 scripts/visual_audit_live.py
      - name: Commit temporary QA evidence to audit branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f visual-audit/evidence-post/
          if ! git diff --cached --quiet; then
            git commit -m "audit: temporary Chromium evidence for human visual review"
            git push origin HEAD:audit/visual-final-20261021
          fi
