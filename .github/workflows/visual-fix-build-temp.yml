name: Temporary regenerate audited visual fixes
on:
  push:
    branches: [fix/final-visual-qa-20261021]
    paths: [.github/workflows/visual-fix-build-temp.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: python3 -m pip install 'Pillow==12.3.0' 'numpy==2.2.6'
      - name: Recompile all canonical static pages
        run: python3 scripts/build.py
      - name: Verify images and generated site
        run: |
          python3 scripts/retouch_artworks.py --check
          python3 scripts/refine_glare_p0.py --check
          python3 scripts/reframe_canelo_reference.py --check
          python3 scripts/generate_gallery_variants.py --check
          python3 scripts/build.py --check
          python3 -m unittest discover -s tests -v
      - name: Commit generated HTML and verified CSS fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html exposiciones/ obras/
          git commit -m "build: regenerate all 15 pages after final visual QA"
          git push origin HEAD:fix/final-visual-qa-20261021
