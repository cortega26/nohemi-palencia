name: Prepare enhanced artist photograph

on:
  push:
    branches: [feature/nohemi-gallery-photo-2x]
    paths:
      - scripts/enhance_artist_photo.py
      - .github/workflows/prepare-artist-photo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependency
        run: python -m pip install Pillow==12.3.0
      - name: Enhance source photograph without generative reconstruction
        run: python scripts/enhance_artist_photo.py
      - name: Commit optimized image to this feature branch
        run: |
          git add assets/img/nohemi-galeria-mejorada-2x.webp
          if git diff --cached --quiet; then
            echo "Enhanced photograph already committed"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "assets: add faithful 2x artist portrait"
          git push origin "HEAD:${GITHUB_REF_NAME}"
