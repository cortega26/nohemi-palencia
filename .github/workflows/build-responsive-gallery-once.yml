name: One-shot create optimized gallery thumbnails
on:
  push:
    branches:
      - feat/responsive-gallery-variants-20261020
    paths:
      - .github/workflows/build-responsive-gallery-once.yml
permissions:
  contents: write
jobs:
  build_gallery_variants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: python3 -m pip install 'Pillow==12.3.0'
      - name: Generate 12 x 2 WebP thumbnails from repository originals
        run: python3 scripts/generate_gallery_variants.py
      - name: Regenerate 16 static routes
        run: python3 scripts/build.py
      - name: Verify generated thumbnails, pages and tests
        run: |
          python3 scripts/generate_gallery_variants.py --check
          python3 scripts/build.py --check
          python3 -m unittest discover -s tests -v
      - name: Commit verified responsive assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/obras/gallery/ index.html
          if git diff --cached --quiet; then echo "No new generated files"; exit 0; fi
          git commit -m "assets: commit 24 artist-faithful responsive gallery variants"
          git push origin "HEAD:feat/responsive-gallery-variants-20261020"
