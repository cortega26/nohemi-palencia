name: Generate fourteen artwork pages (one-shot)

on:
  push:
    branches: [content/add-three-confirmed-works-2026]
    paths:
      - .github/workflows/build-three-works-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all 14 artwork pages and sitemap
        run: python3 scripts/build.py
      - name: Check generated outputs
        run: python3 scripts/build.py --check
      - name: Run all regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Commit static generated HTML on isolated branch
        run: |
          git add index.html sitemap.xml obras/
          if git diff --cached --quiet; then
            echo "Already in sync"; exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: regenerate gallery and sixteen routes for fourteen works"
          git push origin HEAD:${GITHUB_REF_NAME}
