name: Generate neural artist photograph (one-shot)

on:
  push:
    branches: [feature/neural-superresolution-portrait]
    paths:
      - scripts/neural_upscale_artist.py
      - .github/workflows/artist-neural-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU image and neural dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet numpy==1.26.4 Pillow==11.3.0
      - name: Download pinned RealESRGAN x2plus weights
        run: |
          mkdir -p /tmp/artist-neural
          curl --fail --location --retry 3 --connect-timeout 30 \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth \
            -o /tmp/artist-neural/RealESRGAN_x2plus.pth
          echo '49fafd45f8fd7aa8d31ab2a22d14d91b536c34494a5cfe31eb5d89c2fa266abb  /tmp/artist-neural/RealESRGAN_x2plus.pth' | sha256sum -c -
      - name: Run genuine 2x neural super-resolution
        run: |
          python scripts/neural_upscale_artist.py \
            --source assets/img/nohemi-galeria-preview.jpg \
            --weights /tmp/artist-neural/RealESRGAN_x2plus.pth \
            --output assets/img/nohemi-galeria-neural-2x.webp
      - name: Commit generated image to feature branch
        run: |
          git add assets/img/nohemi-galeria-neural-2x.webp
          if git diff --cached --quiet; then
            echo 'Enhanced image already committed'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'assets: neural superresolution of artist gallery photograph'
          git push origin HEAD:${GITHUB_REF_NAME}
